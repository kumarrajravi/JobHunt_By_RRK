name: Build APK
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Decode signing key
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"; fi
      - name: Build
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_FILE: ${{ github.workspace }}/release.keystore
          TAG: ${{ github.event.release.tag_name }}
          RUN: ${{ github.run_number }}
        run: |
          V="${TAG#v}"; [ -z "$V" ] && V="1.0"
          gradle assembleRelease bundleRelease -PversionName="$V" -PversionCode=$((100 + RUN))
          cp app/build/outputs/apk/release/app-release.apk JobHunt_byRRK-v$V.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JobHunt_byRRK
          path: |
            JobHunt_byRRK-*.apk
            app/build/outputs/bundle/release/app-release.aab
      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            JobHunt_byRRK-*.apk
            app/build/outputs/bundle/release/app-release.aab
