<script>

const cfg=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k)||"";localStorage.setItem(k,v)}catch(e){return""}};

const S={v:"",load:"",note:"",hist:[],edit:false,upd:null,cur:DB.cur||null,pend:DB.pend||"",prev:null,splash:true};

const GX=new WeakMap();let gRaf=0,gLast=0;

function mkGal(c){const hue=+c.dataset.h,seed=+c.dataset.s,rnd=seeded(seed),arms=2+(seed%2),st=[];
 for(let i=0;i<1150;i++){const arm=i%arms,r=Math.pow(rnd(),.72);st.push({r,a:arm*(6.2832/arms)+r*4.4+(rnd()-.5)*(.45+r*.95),z:(rnd()-.5)*.07*(1-r),m:.5+rnd()*.9,c:rnd()})}
 for(let i=0;i<300;i++){const r=Math.pow(rnd(),2.2)*.32;st.push({r,a:rnd()*6.2832,z:(rnd()-.5)*.1,m:.6+rnd()*.8,c:.05})}
 return{st,hue,seed,spin:rnd()*6,vx:0,vy:0,rotX:.62,lt:0}}
function drawGal(c,g,t){try{const x=c.getContext("2d");if(!x)return;const dt=Math.min(.06,g.lt?(t-g.lt)/1000:.016);g.lt=t;
 if(!DB.noGalaxyAnim)g.spin+=(0.55+g.vx)*dt;else g.spin+=g.vx*dt;g.rotX+=g.vy*dt+(.62-g.rotX)*.35*dt;g.vx*=Math.pow(.12,dt);g.vy*=Math.pow(.08,dt);
 const rotY=Math.sin(t*.00022+g.seed)*.28,W=c.width,R=W*.46,cx=W/2,cy=W/2,cX=Math.cos(g.rotX),sX=Math.sin(g.rotX),cY=Math.cos(rotY),sY=Math.sin(rotY),u=W/300,fov=520;
 x.globalCompositeOperation="source-over";x.clearRect(0,0,W,W);let gr=x.createRadialGradient(cx,cy,0,cx,cy,R);gr.addColorStop(0,`hsla(${g.hue},85%,65%,.30)`);gr.addColorStop(.4,`hsla(${g.hue+25},80%,45%,.10)`);gr.addColorStop(1,"rgba(0,0,0,0)");x.fillStyle=gr;x.beginPath();x.ellipse(cx,cy,R,R*Math.max(.25,Math.abs(cX))*1.15,0,0,6.3);x.fill();
 x.globalCompositeOperation="lighter";
 for(const s of g.st){const a=s.a+g.spin*(.55+.65/(.3+s.r)),px=Math.cos(a)*s.r*R,py=Math.sin(a)*s.r*R,pz=s.z*R,y1=py*cX-pz*sX,z1=py*sX+pz*cX,x2=px*cY+z1*sY,z2=-px*sY+z1*cY,k=fov/(fov+z2+R),X=cx+x2*k,Y=cy+y1*k,core=s.r<.28,h=core?42:g.hue+s.c*70-25,l=core?86:58+s.c*28,al=core?.75:.35+.5*(1-s.r),z=s.m*(core?1.7:1.3)*u*k;x.fillStyle=`hsla(${h},${core?55:92}%,${l}%,${al})`;x.fillRect(X-z/2,Y-z/2,z,z)}

function startGal(){if(gRaf)return;const loop=t=>{const cs=document.querySelectorAll("canvas.gc");if(!cs.length){gRaf=0;return}if(t-gLast>22){gLast=t;cs.forEach(c=>{let g=GX.get(c);if(!g){g=mkGal(c);GX.set(c,g)}drawGal(c,g,t)})}gRaf=requestAnimationFrame(loop)};gRaf=requestAnimationFrame(loop)}

  const share=f=>NATIVE&&Android.shareFile?Android.shareFile(f.name,f.b64):toast("Sharing works inside the app");$("t1").onclick=()=>share(out.primary);$("t2").onclick=()=>{o.remove();ACT.mail()};$("t3").onclick=()=>{o.remove();render()};if($("t4"))$("t4").onclick=()=>share(out.primary===out.pdf?out.docx:out.pdf);if($("t6"))$("t6").onclick=()=>share(out.alt);if($("t5"))$("t5").onclick=()=>{o.remove();ACT.tlr(true)}}
