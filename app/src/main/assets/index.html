<div class="glass"><h3>Applications (${ap.length})</h3>${ap.length?ap.sort((a,b)=>b.ap-a.ap).map(j=>`<div class="app">${logo(j,1)}<div><b>${esc(j.t)}</b><div class="co">${esc(j.c)} \u00b7 applied ${dayAgo(j.ap)}d ago</div></div><div class="x"><select data-a="st" data-v="${esc(j.id)}">${[["applied","Applied"],["int","Interview"],["offer","Offer"],["rej","Rejected"]].map(o=>`<option value="${o[0]}"${j.st==o[0]?" selected":""}>${o[1]}</option>`).join("")}</select><button class="btn sm" style="width:auto" data-a="open" data-v="${esc(j.u)}">Open job</button></div></div>`).join(""):'<p class="note">Applications you make will show up here.</p>'}<button class="btn ghost" data-a="copy">Copy my summary</button></div>`}
function setV(){const p=prov(),ib=(DB.inbox||[]).slice(0,10),un=(DB.inbox||[]).filter(n=>!n.o).length,sec=(t,b)=>`<details class="sec"><summary>${t}</summary><div class="in">${b}</div></details>`;
 $("v").innerHTML=`<h1><em>Settings</em></h1><p class="sub">Everything in its own crew quarter.</p>
${sec("\u{1F464} Profile and resume",`<input id="nm" value="${esc(DB.name)}" placeholder="Name"><input id="em" value="${esc(DB.email)}" placeholder="Email"><input id="ph" type="tel" value="${esc(DB.phone)}" placeholder="Mobile (optional)"><button class="btn ghost sm" style="margin-top:10px" data-a="edit" data-v="resume">Change resume (${esc(DB.rname||"none")})</button><button class="btn ghost sm" style="margin-top:8px" data-a="edit" data-v="roles">Roles and cities</button>`)}
${sec("\u{1F50D} Job search (Apify)",`<input type="password" id="ak" value="${esc(cfg("apify"))}" placeholder="Apify API token"><p class="note" style="margin:8px 0">Get it free at console.apify.com, Settings, API and integrations.</p><select id="dp"><option value="quick"${DB.depth!="full"?" selected":""}>Quick scan (5 job galaxies)</option><option value="full"${DB.depth=="full"?" selected":""}>Full scan (all galaxies, slower)</option></select>`)}
${sec("\u{1F9E0} AI crew",`<select id="lm">${PROV.map(x=>`<option value="${x.id}"${x.id==p.id?" selected":""}>${esc(x.n)}</option>`).join("")}</select><input id="au" value="${esc(cfg("aiurl")||p.u)}" placeholder="Endpoint URL"><input id="am" value="${esc(cfg("aimodel")||p.m)}" placeholder="Model">${p.k?`<input type="password" id="ik" value="${esc(cfg("aikey"))}" placeholder="API key">`:""}${aiHelp(p)}<div class="row" style="gap:8px;margin-top:10px"><button class="btn ghost sm" data-a="aifill" style="flex:1">Auto-fill fields</button><button class="btn sm" data-a="aitest" style="flex:1">Test</button></div>`)}
${sec("\u{1F4E1} Mission Control messages"+(un?` (${un} new)`:""),(ib.length?ib.map(n=>`<div class="mrow" data-a="nopen" data-v="${esc(n.id)}"><div><b>${n.o?"":"\u25CF "}${esc(n.title)}</b><span class="co">${esc(n.msg)}</span></div></div>`).join(""):'<p class="note">No messages yet. HQ will ping you here.</p>')+'<div class="row" style="gap:8px;margin-top:10px"><button class="btn ghost sm" data-a="poll" style="flex:1">Check now</button><button class="btn ghost sm" data-a="ntest" style="flex:1">Test alert</button></div>')}
${sec("\u{1F512} Data and privacy",'<p class="note" style="margin:0">With your consent the app shares your name, email, mobile, phone model, searches and applications with the app owner. Your resume text and keys never leave this phone. Use Reset to wipe local data.</p>')}
${sec("\u{1F680} About and mission log",`<p style="margin:0 0 8px"><b>Escape Velocity - by RRK</b><br>Made by Raviraj Kumar</p><div class="row"><span>Launched</span><b>${LOG[LOG.length-1].d}</b></div><div class="row" style="margin-bottom:8px"><span>Last update</span><b>${LOG[0].d} (v${LOG[0].v})</b></div><button class="btn ghost sm" style="margin-bottom:12px" data-a="tour">Replay quick tour</button>${LOG.map(l=>`<div class="log"><b>v${l.v} - ${esc(l.n)}</b><small>${l.d}</small><ul>${l.t.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`).join("")}`)}
<button class="btn" data-a="sv">Save settings</button><button class="btn ghost" data-a="chk">Check for updates (v${esc(VER)})</button><button class="btn ghost" style="color:#ff6b8b" data-a="reset">Reset everything</button>`;
 $("lm").onchange=e=>{const q=PROV.find(x=>x.id==e.target.value);cfg("llm",q.id);cfg("aiurl","");cfg("aimodel","");setV()}}
const cur=()=>DB.jobs[S.cur];
function mark(st){const j=cur();if(!j)return;S.hist.push({id:j.id,p:j.st});j.st=st;if(st=="applied")j.ap=Date.now();S.note="";S.cur=null;DB.cur="";save();track(st,(j.c||"")+" | "+j.t);if(st=="applied")appSync(j);userSync(false);render();scrollTo(0,0)}
const ACT={
tour(){slides(0)},
fill(){},
gal(v){S.gal=v===""?null:v;S.cur=null;S.v="jobs";S.edit=false;render();scrollTo(0,0)},
nopen(v){nopen(v)},
aifill(){cfg("aiurl","");cfg("aimodel","");setV();toast("Endpoint and model reset to this provider's defaults")},
async poll(){toast("Checking Mission Control...");if(NATIVE&&Android.pollNow)Android.pollNow();await notifSync();toast((DB.inbox||[]).length+" messages in your inbox")},
ntest(){if(NATIVE&&Android.testNotif){Android.testNotif();toast("Test sent. Check your notification bar. If nothing shows, allow notifications for this app in Android settings.")}else toast("Test alerts work inside the app")},
async aitest(){const p=prov(),t0=Date.now(),o=document.createElement("div");o.className="mod";o.innerHTML='<div class="glass"><h2>Testing...</h2><p class="note" style="margin-top:8px">Contacting '+esc(p.n)+'</p></div>';document.body.appendChild(o);let res;
 try{const r=await ai('Return {"ok":"yes"}',"ping",true);res=["It works","Replied in "+((Date.now()-t0)/1000).toFixed(1)+"s: "+JSON.stringify(r).slice(0,80)];S.aiDown=0;S.aiFails=0}catch(e){res=["Not working right now","Details: "+e.message+"\n\nWhat to try: "+(p.k?"check that the key, endpoint and model match the steps above.":"the free crew may be busy. Emails and tailoring still work without it. Try again later, or pick a provider with a free key.")]}
 o.innerHTML=`<div class="glass"><h2>${res[0]}</h2><p class="note" style="margin:8px 0 0;white-space:pre-wrap">${esc(res[1])}</p><button class="btn sm" id="ok2" style="margin-top:14px">Close</button></div>`;$("ok2").onclick=()=>o.remove()},
async refs(v){const j=cur(),box=$("rf");if(v=="force")j.rf=1;box.innerHTML='<p class="note">Scanning the company crew...</p>';try{j.pool=rank(await fetchPeople(j),j);j.rs=3;save();track("referral",j.c)}catch(e){j.pool=[]}box.innerHTML=refBox(j)},
async more(){const j=cur(),box=$("rf");if((j.rs||3)<j.pool.length){j.rs=(j.rs||3)+3;save();box.innerHTML=refBox(j);return}box.innerHTML='<p class="note">Searching wider...</p>';try{const m=await fetchPeople(j,true),have=new Set(j.pool.map(x=>x.u));j.pool=j.pool.concat(rank(m.filter(x=>!have.has(x.u)),j));j.rs=(j.rs||3)+3;save()}catch(e){}box.innerHTML=refBox(j)},
async tlr(){const j=cur(),o=document.createElement("div");o.className="mod";o.innerHTML='<div class="glass"><h2>Tailoring...</h2><p class="note" style="margin-top:8px">Weaving the missing keywords into your existing wins.</p></div>';document.body.appendChild(o);
 try{const ch=await tailor(j);if(!ch.length)throw new Error("no safe spots found to add keywords");const b64=await makeDocx(applyChanges(normResume(DB.rt),ch)),name=(DB.name||"Resume").replace(/\s+/g,"_")+"_Resume_"+(j.c||"job").replace(/[^A-Za-z0-9]+/g,"_")+".docx";j.tl={name,b64};save();
  o.innerHTML=`<div class="glass"><h2>Your tailored resume</h2><p class="note" style="margin:6px 0 0">${ch[0].basic?"Basic mode (AI offline). Please review every line.":"Rewritten in Google XYZ format. Check that every line is true."}</p><div class="mbox">${ch.map(c=>`<div class="chg"><s>${esc(c.old)}</s><em>${esc(c.new)}</em></div>`).join("")}</div><div class="row" style="gap:10px;margin-top:14px"><button class="btn ghost sm" id="t1" style="flex:1">Share / save</button><button class="btn sm" id="t2" style="flex:1">Email with it</button></div><button class="txt" id="t3" style="width:100%;margin-top:8px">Close</button></div>`;
  $("t1").onclick=()=>{NATIVE&&Android.shareFile?Android.shareFile(name,b64):toast("Sharing works inside the app")};$("t2").onclick=()=>{o.remove();ACT.mail()};$("t3").onclick=()=>{o.remove();render()}}
 catch(e){o.remove();toast("Could not tailor: "+e.message)}},
gear(){S.prev=S.v;S.v="set";render()},
keynext(){cfg("apify",$("ak").value.trim());cfg("aiurl",$("au").value.trim());cfg("aimodel",$("am").value.trim());if($("ik"))cfg("aikey",$("ik").value.trim());S.v="ready";render()},
reset(){ask("Reset everything?","This wipes your profile, jobs, keys and settings from this phone and starts from the beginning. Data already shared with mission control stays there.","Yes, reset","Cancel",()=>{track("reset","");setTimeout(()=>{try{localStorage.clear()}catch(e){}if(NATIVE&&Android.clearResume)Android.clearResume();location.reload()},500)})},
tab(v){S.v=v;S.edit=false;render();scrollTo(0,0)},edit(v){S.edit=true;S.v=v;render()},
wel(){const n=$("nm").value.trim(),m=$("em").value.trim();if(!n||!/^\S+@\S+\.\S+$/.test(m)){$("er").textContent="Please enter your name and a valid email.";return}if(!$("cs").checked){$("er").textContent="Please tick the box to continue.";return}DB.name=n;DB.email=m;DB.phone=$("ph").value.trim();DB.consent=true;save();track("signup","");userSync(true);S.v=DB.rname?"home":"resume";render();if(!DB.tourAsk){DB.tourAsk=1;save();setTimeout(()=>ask("Quick tour?","Want a 30-second look at how everything works? You can skip it.","Show me","Skip",()=>slides(0)),500)}},
next(v){if(S.edit){S.edit=false;S.v="home"}else S.v=v;render()},
role(v){const i=DB.roles.indexOf(v);i>=0?DB.roles.splice(i,1):DB.roles.push(v);save();rolesV()},
addrole(v){v=v.trim();if(!v)return;if(!allRoles().some(r=>r.toLowerCase()==v.toLowerCase()))DB.custom.push(v);const m=allRoles().find(r=>r.toLowerCase()==v.toLowerCase());if(!DB.roles.includes(m))DB.roles.push(m);save();rolesV()},
loc(v){const i=DB.locs.indexOf(v);i>=0?DB.locs.splice(i,1):DB.locs.push(v);save();whereV()},
async launch(){save();if(!DB.launched){DB.launched=true;save();track("first_launch","");await countdown()}await ACT.refresh()},
async refresh(){S.v="jobs";S.hist=[];S.gal=null;try{await search()}catch(e){S.note="Search failed: "+e.message}S.load="";S.cur=null;render()},
apply(){const j=cur();if(!j)return;fx("rocket",()=>{S.pend=j.id;DB.pend=j.id;save();openU(j.u);render()})},
skip(){mark("skip")},done(){fx("tick",()=>mark("applied"))},
back(){const h=S.hist.pop();if(!h)return;const j=DB.jobs[h.id];if(j){j.st=h.p;if(h.p=="new")delete j.ap}S.cur=h.id;save();S.v="jobs";render();scrollTo(0,0)},
async mail(){const j=cur(),b=$("em");b.classList.add("busy");let d;try{d=await draft(j)}catch(e){d=tpl(j);S.by="Basic template"}b.classList.remove("busy");track("email_draft",(j.c||"")+" | "+j.t);toast("Email drafted by "+S.by+(j.tl?" with your tailored resume":""));S.aierr="";fx("mail",()=>sendMail(j,d))},
wa(){const j=cur();openU(`https://wa.me/91${j.ph}?text=${encodeURIComponent(`Hi, I saw the ${j.t} opening${j.c?" at "+j.c:""}. I am ${DB.name}. Is the role still open? Happy to share my resume.`)}`)},
open(v){openU(v)},jd(){const e=$("fj");e.style.display=e.style.display=="none"?"block":"none"},
msg(v){const j=cur(),m=`Hi ${v.split(" ")[0]}, I'm ${DB.name}. I saw the ${j.t} opening at ${j.c} and my background looks like a good fit. Could you refer me or point me to the right person? Happy to send my resume. Thank you!`;try{navigator.clipboard.writeText(m);alert("Message copied. Paste it in LinkedIn.")}catch(e){alert(m)}},
st(v,b){const j=DB.jobs[v];if(j){j.st=b.value;save();appSync(j);track("status",b.value+" | "+j.t);userSync(false);dashV()}},goal(v){DB.goal=Math.max(1,DB.goal+ +v);save();dashV()},
copy(){const ap=Object.values(DB.jobs).filter(j=>["applied","int","offer","rej"].includes(j.st)),m=`My Escape Velocity summary: ${ap.length} applications, ${ap.filter(j=>j.st=="int").length} interviews, ${ap.filter(j=>j.st=="offer").length} offers.\n`+ap.map(j=>`- ${j.t} at ${j.c} (${j.st})`).join("\n");try{navigator.clipboard.writeText(m);alert("Summary copied.")}catch(e){alert(m)}},
sv(){DB.name=$("nm").value.trim()||DB.name;DB.email=$("em").value.trim()||DB.email;DB.phone=$("ph")?$("ph").value.trim():DB.phone;DB.depth=$("dp").value;cfg("apify",$("ak").value.trim());cfg("aiurl",$("au").value.trim());cfg("aimodel",$("am").value.trim());if($("ik"))cfg("aikey",$("ik").value.trim());save();track("settings","llm="+(cfg("llm")||"free"));S.v="home";render();alert("Saved.")},
chk(){chk(true)},upd(){if(!NATIVE){window.open(S.upd.u);return}const o=document.createElement("div");o.className="mod";o.id="um";o.innerHTML='<div class="glass"><h2>Updating to v'+esc(S.upd.v)+'</h2><p class="note" id="up" style="margin-top:8px">Starting...</p></div>';document.body.appendChild(o);Android.install(S.upd.u)}};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b&&b.tagName!="SELECT"&&ACT[b.dataset.a])ACT[b.dataset.a](b.dataset.v,b)});
document.addEventListener("change",e=>{const b=e.target;if(b.tagName=="SELECT"&&b.dataset.a&&ACT[b.dataset.a])ACT[b.dataset.a](b.dataset.v,b)});
window.__back=()=>{if(S.load)return true;if(S.v=="set"&&S.prev&&!TABS.includes(S.prev)){S.v=S.prev;S.prev=null;render();return true}if(S.v=="keys"){S.v="where";render();return true}if(S.v=="ready"){S.v="keys";render();return true}if(S.edit){S.edit=false;S.v="home";render();return true}if(S.v=="roles"){S.v="resume";render();return true}if(S.v=="where"){S.v="roles";render();return true}if(S.v=="jobs"&&S.hist.length){ACT.back();return true}if(S.v!="home"&&TABS.includes(S.v)){S.v="home";render();return true}return false};
const newer=(a,b)=>{a=a.split(".").map(Number);b=b.split(".").map(Number);for(let i=0;i<3;i++){if((a[i]||0)>(b[i]||0))return true;if((a[i]||0)<(b[i]||0))return false}return false};
async function chk(manual){try{const r=JSON.parse(await req("https://api.github.com/repos/kumarrajravi/JobHunt_By_RRK/releases/latest","GET","",{Accept:"application/vnd.github+json"})),v=(r.tag_name||"").replace(/^v/i,""),a=(r.assets||[]).find(x=>x.name.endsWith(".apk"));
 if(a&&newer(v,VER)){S.upd={v,u:a.browser_download_url};render()}else if(manual)alert("You have the latest version (v"+VER+").")}catch(e){if(manual)alert("Could not check for updates: "+e.message)}}
splash();chk(false);
