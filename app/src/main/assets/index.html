// --- NEW HYPERSPACE STARFIELD WARP ---
class WarpEffect {
    constructor() {
        this.canvas = document.createElement('canvas');
        this.ctx = this.canvas.getContext('2d');
        this.canvas.style.position = 'fixed';
        this.canvas.style.inset = '0';
        this.canvas.style.zIndex = '9999';
        this.canvas.style.pointerEvents = 'none';
        this.canvas.style.background = DB.theme === 'day' ? '#f2f5f9' : '#04060d';
        document.body.appendChild(this.canvas);
        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.stars = [];
        this.numStars = 800;
        this.speed = 0.05;
        this.initialized = false;
        this.raf = null;
        this.initStars();
    }

    resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
        this.cx = this.canvas.width / 2;
        this.cy = this.canvas.height / 2;
    }

    initStars() {
        for (let i = 0; i < this.numStars; i++) {
            this.stars.push({
                x: (Math.random() - 0.5) * 2000,
                y: (Math.random() - 0.5) * 2000,
                z: Math.random() * 2000,
                pz: 0
            });
        }
    }

    start(callback) {
        if (this.initialized) return;
        this.initialized = true;
        this.callback = callback;
        this.startTime = performance.now();

        const animate = (time) => {
            const elapsed = time - this.startTime;
            const accel = Math.min(elapsed / 500, 1);
            const currentSpeed = 20 + accel * 120; // Warp speed

            // Fade trail slightly (adjust for day theme)
            this.ctx.fillStyle = DB.theme === 'day' ? 'rgba(242, 245, 249, 0.3)' : 'rgba(4, 6, 13, 0.3)';
            this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

            this.stars.forEach(star => {
                star.pz = star.z;
                star.z -= currentSpeed * 0.016; // ~60fps

                if (star.z <= 0) {
                    star.z = 2000;
                    star.x = (Math.random() - 0.5) * 2000;
                    star.y = (Math.random() - 0.5) * 2000;
                    star.pz = star.z;
                }

                const x = (star.x / star.z) * this.cx + this.cx;
                const y = (star.y / star.z) * this.cy + this.cy;
                const px = (star.x / star.pz) * this.cx + this.cx;
                const py = (star.y / star.pz) * this.cy + this.cy;

                const size = Math.max(0.2, (1 - star.z / 2000) * 3);

                this.ctx.beginPath();
                this.ctx.moveTo(px, py);
                this.ctx.lineTo(x, y);
                
                // Star color adjust for day/night
                if (DB.theme === 'day') {
                    this.ctx.strokeStyle = `rgba(100, 100, 150, ${1 - star.z / 2000})`;
                } else {
                    this.ctx.strokeStyle = `rgba(255, 255, 255, ${1 - star.z / 2000})`;
                }
                
                this.ctx.lineWidth = size;
                this.ctx.stroke();
            });

            if (elapsed < 1200) { // 1.2 seconds
                this.raf = requestAnimationFrame(animate);
            } else {
                this.canvas.style.transition = 'opacity 0.3s';
                this.canvas.style.opacity = '0';
                setTimeout(() => {
                    this.canvas.remove();
                    if (this.callback) this.callback();
                }, 300);
            }
        };
        this.raf = requestAnimationFrame(animate);
    }
}
